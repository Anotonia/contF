[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contf"
version = "0.1.0"
description = "Evidence-driven video pattern research and content evolution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
contf = "contf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
