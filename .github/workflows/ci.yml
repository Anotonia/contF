name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test standard-library evaluation
        run: python3 -m unittest discover -s tests -v
      - name: Run synthetic observation review
        run: PYTHONPATH=src python3 -m contf.cli review --experiments data/examples/experiments.json --observations data/examples/observations.json
